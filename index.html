<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candy Shock</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEE8FF; --surface:#FFFFFF; --ink:#231B4F; --muted:#6C6495; --line:#D8CFF7;
  --board:#2B2263; --cell:#342A74; --track:#DCD3FA; --gold:#FFB627; --gold-ink:#4A2F00; --danger:#E8344F;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120E2C; --surface:#1E1846; --ink:#F3EFFF; --muted:#A79FD3; --line:#2F2868;
    --board:#231B56; --cell:#2C236A; --track:#2E2766; --danger:#FF5C76; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120E2C; --surface:#1E1846; --ink:#F3EFFF; --muted:#A79FD3; --line:#2F2868;
  --board:#231B56; --cell:#2C236A; --track:#2E2766; --danger:#FF5C76; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:14px;padding:14px 14px 16px}
.top{display:flex;align-items:center;justify-content:space-between}
.title{font-weight:900;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.title .bolt{display:inline-block;font-size:.85em;filter:drop-shadow(0 0 6px rgba(255,194,26,.7));animation:boltFlick 3.2s infinite}
@keyframes boltFlick{0%,86%,100%{opacity:1}88%{opacity:.35}90%{opacity:1}92%{opacity:.5}94%{opacity:1}}
@media (prefers-reduced-motion: reduce){ .title .bolt{animation:none} }
.title small{display:block;font-weight:600;font-size:14px;color:var(--muted);letter-spacing:0}
.top-left{display:flex;align-items:center;gap:12px}
.avatar-btn{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;flex:none}
.avatar{position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;background:var(--av,#7A5CFF);flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.lg{width:72px;height:72px;font-size:28px}
.avatar-btn .lvl{position:absolute;right:-5px;bottom:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg)}
.avatar-btn .dot{position:absolute;right:-1px;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--danger);border:2px solid var(--bg);display:none}
.avatar-btn.has-daily .dot{display:block}
.sheet{max-height:88vh;overflow:auto}
.prof-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.avatar-edit{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;flex:none}
.avatar-edit .cam{position:absolute;right:-3px;bottom:-3px;width:28px;height:28px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:14px;border:2px solid var(--surface)}
.name-edit{border:0;background:var(--track);border-radius:10px;width:30px;height:30px;font-size:14px;cursor:pointer;vertical-align:3px;margin-left:2px}
.text-in{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--track);color:var(--ink);font:inherit;font-weight:800;font-size:17px;margin-bottom:12px;user-select:text;-webkit-user-select:text}
.text-in:focus{outline:2px solid var(--gold);outline-offset:1px}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.dcard{position:relative;border-radius:16px;padding:10px 4px 10px;text-align:center;background:var(--track);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px}
.dcard.big{grid-column:span 2;background:linear-gradient(135deg,#FFC21A,#FF8A1F 55%,#FF3B5C);color:#3A1600;box-shadow:0 6px 18px rgba(255,138,31,.35)}
.dcard.today{border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 3px rgba(255,194,26,.25)}
.dcard.big.today{border-color:#fff;animation:glow 1.6s ease-in-out infinite}
.dcard.got{opacity:.6}
.dcard.got.big{opacity:.75}
.dday{font-size:12px;font-weight:800;color:var(--muted)}
.dcard.big .dday{color:#3A1600}
.dgift{font-size:30px;line-height:1}
.dprize{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-weight:900;font-size:16px}
.dprize span{display:inline-flex;align-items:center;gap:3px}
.dprize .coin,.dprize .gstar{width:18px;height:18px}
.dcard.big .dprize{font-size:20px}
.dcard.big .dprize .coin,.dcard.big .dprize .gstar{width:24px;height:24px}
.dcheck{position:absolute;top:4px;right:6px;width:20px;height:20px;border-radius:50%;background:#3FD45A;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center}
.dcard.pop-in{animation:popIn .5s ease-out}
@keyframes glow{50%{box-shadow:0 6px 26px rgba(255,194,26,.75)}}
@keyframes popIn{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){ .dcard.big.today,.dcard.pop-in{animation:none} }
.screen{position:fixed;inset:0;z-index:12;background-color:var(--bg);background-attachment:fixed;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen[hidden]{display:none}
.menu{max-width:520px;min-height:100%;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.menu-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-user{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:inherit;font-weight:900;font-size:16px;cursor:pointer;padding:0;min-width:0}
.m-user #mName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:inherit;font-weight:800;font-size:15px;color:var(--ink)}
button.pill{cursor:pointer}
.pill b{background:var(--gold);color:var(--gold-ink);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:15px}
.pill .gstar{width:16px;height:16px;vertical-align:0}
.logo-wrap{text-align:center;margin-top:6px}
.logo{font-size:clamp(40px,12vw,58px);font-weight:900;line-height:1;letter-spacing:-.02em;background:linear-gradient(180deg,#FFF1A8,#FFC21A 55%,#FF8A1F);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(26,16,64,.55))}
.logo-wrap .bolt{font-size:clamp(30px,9vw,44px);margin-left:4px;display:inline-block;filter:drop-shadow(0 0 8px rgba(255,194,26,.8));animation:boltFlick 3.2s infinite}
.hero{display:flex;justify-content:center;gap:12px;margin:4px 0}
.hero svg{width:clamp(48px,14vw,68px);height:clamp(48px,14vw,68px);animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.hero svg:nth-child(2){animation-delay:.3s}.hero svg:nth-child(3){animation-delay:.6s}.hero svg:nth-child(4){animation-delay:.9s}.hero svg:nth-child(5){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-9px) rotate(7deg)}}
.world-card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.wico{font-size:38px;width:62px;height:62px;flex:none;display:grid;place-items:center;border-radius:18px;background:var(--track)}
.world-card .wtxt{flex:1;min-width:0}
.world-card b{display:block;font-size:18px;font-weight:900}
.world-card small{display:block;color:var(--muted);font-weight:700;margin:2px 0 8px}
.btn.big{padding:18px;font-size:19px;border-radius:18px;box-shadow:0 6px 0 #C7820A;margin-bottom:4px}
.btn.big:active{transform:translateY(3px);box-shadow:0 3px 0 #C7820A}
.btn.big2{padding:15px;font-size:17px;border-radius:18px;margin-top:0;background:var(--surface)}
.menu-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.mbtn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 4px;color:var(--ink);font:inherit;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.mbtn .e{font-size:24px}
.mbtn .dot{position:absolute;right:8px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);display:none}
.mbtn.has-dot .dot{display:block}
.map-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.map-top h2{margin:0;font-size:22px;font-weight:900;flex:1}
.map-list{max-width:520px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:16px}
.wsec{border-radius:24px;padding:14px;background-color:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.wsec.locked .path{filter:grayscale(1);opacity:.4}
.whead{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.whead .wico{width:50px;height:50px;font-size:30px;border-radius:14px;background:var(--surface)}
.whead b{display:block;font-size:17px;font-weight:900}
.whead small{color:var(--muted);font-weight:700;display:flex;align-items:center;gap:4px}
.whead small .gstar{width:14px;height:14px}
.wlock{margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--surface);font-weight:800;color:var(--muted);text-align:center;position:relative;z-index:1}
.path{position:relative;margin-top:6px}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.85);font:inherit;font-weight:900;font-size:18px;cursor:pointer;display:grid;place-items:center;background:#CFC8E8;color:#6C6495;box-shadow:0 4px 0 rgba(0,0,0,.25);padding:0}
.node.done{background:linear-gradient(180deg,#B794FF,#7B4DFF);color:#fff}
.node.cur{background:linear-gradient(180deg,#FFE27A,#FFB627);color:#4A2F00;width:66px;height:66px;font-size:22px;animation:glow 1.6s ease-in-out infinite;z-index:1}
.node.locked{cursor:default}
.node .ns{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);display:flex;gap:0}
.node .ns .gstar{width:14px;height:14px}
.node .nav{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:30px;height:30px;font-size:12px;border:2px solid #fff}
.wintro{text-align:center}
.wbig{font-size:84px;line-height:1;margin:6px 0 10px;animation:popIn .6s ease-out}
.wname{font-size:22px;font-weight:900;color:var(--ink) !important;margin-bottom:8px !important}
@media (prefers-reduced-motion: reduce){ .hero svg,.node.cur,.wbig,.logo-wrap .bolt{animation:none} }
.prof-name{font-size:22px;font-weight:900;line-height:1.15}
.prof-rank{color:var(--muted);font-weight:700;font-size:14px}
.xp-row{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px}
.xp-row span{color:var(--muted)}
.daily{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:16px 0}
.daily b{display:block;font-size:16px}
.daily small{color:var(--muted);font-weight:600;font-size:13px}
.daily .btn{width:auto;padding:10px 14px;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--track);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:700;line-height:1.2}
.section-title{font-weight:900;font-size:17px;margin:0 0 10px}
.ach-list{display:grid;gap:8px;margin-bottom:6px}
.ach{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line)}
.ach .ico{font-size:22px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--track);flex:none}
.ach.locked .ico{filter:grayscale(1);opacity:.45}
.ach.locked .ach-name{color:var(--muted)}
.ach-name{font-weight:800;font-size:15px}
.ach-desc{font-size:13px;color:var(--muted);font-weight:600}
.ach-rew{margin-left:auto;font-weight:800;font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.ach-rew .coin{width:16px;height:16px}
.ach.done .ach-rew{color:var(--muted)}
.notice{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(35,27,79,.25);transition:transform .3s ease;max-width:calc(100% - 24px);text-align:center}
.notice.show{transform:translate(-50%,0)}
.top-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px}
.field{margin-bottom:18px}
.field-label{font-weight:800;font-size:15px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--track);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;color:var(--ink);padding:11px 4px;border-radius:10px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 6px rgba(35,27,79,.18)}
.coins{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-weight:800;font-size:17px}
.coins .plus{width:32px;height:32px;border-radius:50%;border:0;background:var(--gold);color:var(--gold-ink);font:inherit;font-size:22px;line-height:1;font-weight:900;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.goal-text{font-weight:800;font-size:16px}
.goal-text span{color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#FF8A2B,var(--gold));transition:width .35s ease}
.moves{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 16px;text-align:center;min-width:84px}
.moves b{display:block;font-size:30px;font-weight:900;line-height:1.05}
.moves span{font-size:13px;color:var(--muted);font-weight:600}
.moves.low b{color:var(--danger)}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board-frame{
  width:min(100%,58vh);aspect-ratio:1/1;padding:10px;border-radius:26px;
  background:#231E30 center/cover no-repeat;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -4px 0 rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.4),0 14px 34px rgba(20,14,40,.4);
}
.board-frame[data-skin="classic"]{padding:0;background:none;box-shadow:none;border-radius:22px}
.board-frame[data-skin="classic"] .board{border-radius:22px;background:repeating-conic-gradient(var(--cell) 0 25%,transparent 0 50%) 0 0/25% 25% var(--board);box-shadow:0 10px 30px rgba(35,27,79,.25)}
.board-frame[data-skin="wood"]{background-color:#2A190F}
.board-frame[data-skin="stars"]{background-color:#121632;box-shadow:inset 0 0 0 2px rgba(232,196,106,.55),inset 0 -4px 0 rgba(0,0,0,.5),0 14px 34px rgba(20,14,40,.4)}
.skins{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 26px)/4.25);gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:2px 2px 6px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.skins::-webkit-scrollbar{display:none}
.skins .skin{scroll-snap-align:start}
.skin{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 4px 8px;border-radius:14px;border:2px solid transparent;background:var(--track);color:var(--ink);font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.skin[aria-pressed="true"]{border-color:var(--gold);background:var(--surface)}
.gstar{width:18px;height:18px;vertical-align:-3px}
.win-stars{display:flex;justify-content:center;gap:10px;margin:2px 0 14px}
.win-stars .gstar{width:54px;height:54px}
.win-stars .on{animation:starIn .45s ease-out both}
.win-stars .on:nth-child(2){animation-delay:.15s}
.win-stars .on:nth-child(3){animation-delay:.3s}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:none}}
.wallet{display:flex;align-items:center;gap:6px;font-weight:800;margin:-4px 0 16px;color:var(--ink)}
.ptag{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted)}
.ptag .gstar{width:14px;height:14px;vertical-align:0}
.sw{position:relative}
.sw.locked::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;background:rgba(10,6,30,.45);border-radius:10px}
.sw-bg{background-color:var(--bg)}
.unlock-prev{width:120px;aspect-ratio:1/1;border-radius:18px;margin:0 auto 14px;background-color:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.sw{display:block;width:100%;aspect-ratio:1/1;border-radius:10px;background-color:#231E30;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.board{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;touch-action:none;
  background:#231E30 0 0/100% 100% no-repeat;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.55),0 0 0 2px rgba(0,0,0,.4);
}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .26s cubic-bezier(.3,.7,.4,1);will-change:transform;cursor:pointer}
.piece{width:100%;height:100%;padding:8%;transition:transform .2s ease,opacity .2s ease}
.piece svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28))}
.tile.sel .piece{transform:scale(1.14)}
.tile.sel::after{content:"";position:absolute;inset:3%;border-radius:24%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
.tile.pop .piece{transform:scale(0) rotate(40deg);opacity:0}
.tile.hint .piece{animation:wiggle .9s ease-in-out infinite}
.tile.born .piece{animation:born .38s ease-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg) scale(1.06)}75%{transform:rotate(11deg) scale(1.06)}}
@keyframes born{0%{transform:scale(.4)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
.beam{position:absolute;pointer-events:none;z-index:5;background:rgba(255,255,255,.85);border-radius:99px;box-shadow:0 0 18px 6px rgba(255,255,255,.6)}
.beam.row{left:0;right:0;height:12.5%;animation:beamRow .42s ease-out forwards}
.beam.col{top:0;bottom:0;width:12.5%;animation:beamCol .42s ease-out forwards}
@keyframes beamRow{from{opacity:1;transform:scaleY(.25)}to{opacity:0;transform:scaleY(.9)}}
@keyframes beamCol{from{opacity:1;transform:scaleX(.25)}to{opacity:0;transform:scaleX(.9)}}
.flyer{position:absolute;left:0;top:0;width:12.5%;height:12.5%;z-index:7;pointer-events:none;padding:4%;transition:transform .48s cubic-bezier(.45,0,.3,1)}
.flyer svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 5px rgba(0,0,0,.35))}
@media (prefers-reduced-motion: reduce){ .flyer{transition-duration:.12s} }
.tile.shock .piece{animation:shock .17s steps(2) infinite}

function processPhoto(file){
  if (!file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    let out = null;
    for (const size of [128, 96, 72]){
      const cv = document.createElement('canvas'); cv.width = cv.height = size;
      const cx = cv.getContext('2d'), m = Math.min(img.width, img.height);
      cx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size);
      for (const q of [.82, .7, .6, .5, .4]){ const d = cv.toDataURL('image/jpeg', q); if (d.length <= 4000){ out = d; break; } }
      if (out) break;
    }
    URL.revokeObjectURL(url);
    if (!out){ notify(t('photoErr')); return; }
    setAvatar(out); sfx('unlock'); notify(t('photoSaved')); openProfile();
  };
  img.onerror = () => { URL.revokeObjectURL(url); notify(t('photoErr')); };
  img.src = url;
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16), f = v => Math.max(0,Math.min(255,Math.round(v*(1+amt))));
  return '#'+((1<<24)+(f(n>>16)<<16)+(f((n>>8)&255)<<8)+f(n&255)).toString(16).slice(1);
}
function mix(hex, to, k){
  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const x = p(hex), y = p(to);
  return '#' + x.map((v,i) => Math.round(v + (y[i]-v)*k).toString(16).padStart(2,'0')).join('');
}

/* ---------- board logic ---------- */
function genBoard(){
  do {
    grid = [];
    for (let r=0;r<N;r++){
      grid.push([]);
      for (let c=0;c<N;c++){
        let t;
        do { t = randType(); } while ((c>=2 && grid[r][c-1].type===t && grid[r][c-2].type===t) || (r>=2 && grid[r-1][c].type===t && grid[r-2][c].type===t) || (r>=1 && c>=1 && grid[r-1][c].type===t && grid[r][c-1].type===t && grid[r-1][c-1].type===t));
        grid[r].push({ id:nextId++, type:t, special:null });
      }
    }
  } while (!findMove());
}
function findRuns(){
  const runs = [];
  for (let r=0;r<N;r++){ let c=0; while(c<N){ const t=tt(r,c); let e=c+1; if(t>=0) while(e<N && tt(r,e)===t) e++;
    if (t>=0 && e-c>=3){ const cells=[]; for(let k=c;k<e;k++) cells.push([r,k]); runs.push({dir:'h',cells}); } c=e; } }
  for (let c=0;c<N;c++){ let r=0; while(r<N){ const t=tt(r,c); let e=r+1; if(t>=0) while(e<N && tt(e,c)===t) e++;
    if (t>=0 && e-r>=3){ const cells=[]; for(let k=r;k<e;k++) cells.push([k,c]); runs.push({dir:'v',cells}); } r=e; } }
  for (let r=0;r<N-1;r++) for (let c=0;c<N-1;c++){
    const t=tt(r,c);
    if (t>=0 && tt(r,c+1)===t && tt(r+1,c)===t && tt(r+1,c+1)===t) runs.push({dir:'sq', cells:[[r,c],[r,c+1],[r+1,c],[r+1,c+1]]});

function swapCells(a,b){ const t=grid[a[0]][a[1]]; grid[a[0]][a[1]]=grid[b[0]][b[1]]; grid[b[0]][b[1]]=t; }
function findMove(){
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    const x = at(r,c); if (!x || caged(r,c)) continue;
    if (x.special === 'bomb' || x.special === 'plane'){ const nb = [[r,c+1],[r,c-1],[r+1,c],[r-1,c]].find(p => inB(p) && !caged(...p)); if (nb) return [[r,c], nb]; continue; }
    for (const [dr,dc] of [[0,1],[1,0]]){
      const b=[r+dr,c+dc]; if(!inB(b) || caged(...b)) continue;
      swapCells([r,c],b); const ok = findRuns().length>0; swapCells([r,c],b);
      if (ok) return [[r,c],b];
    }
  }
  return null;
}

/* ---------- turn flow ---------- */
function nope(cell){ sfx('nope'); const el = elAt(...cell); if (!el) return; el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); }
async function attemptSwap(a,b){
  if (busy || ended || moves<=0 || !inB(b)) return;
  if (caged(...a) || caged(...b)){ setSel(null); nope(caged(...a) ? a : b); toast(t('tCaged')); return; }
  busy = true; clearHint(); setSel(null);
  swapCells(a,b); render(); sfx('swap'); await wait(210);
  const ta = grid[b[0]][b[1]], tb = grid[a[0]][a[1]];
  if (ta.special==='bomb' || tb.special==='bomb'){
    moves--; hud();
    const set = new Set();
    if (ta.special==='bomb' && tb.special==='bomb'){
      for (let r=0;r<N;r++) for (let c=0;c<N;c++) set.add(key(r,c));
      ta.special = tb.special = 'spent';
    } else {
      const [bp, bombTile, other] = ta.special==='bomb' ? [b,ta,tb] : [a,tb,ta];
      bombTile.special = 'spent';
      set.add(key(...bp));
      set.add(key(...a)); set.add(key(...b));
      const ot = other.type >= 0 ? other.type : mostCommonType();
      for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (tt(r,c)===ot) set.add(key(r,c));
      if (other.special==='row' || other.special==='col'){
        set.forEach(k=>{ const t=at(Math.floor(k/N),k%N); if(t && t.type>=0) t.special = Math.random()<.5?'row':'col'; });
      }
    }
    toast(t('tBoom')); sfx('rainbow');
    await resolve(set, null);
  } else if (ta.special==='plane' || tb.special==='plane'){
    moves--; hud();
    const set = new Set();
    const pairs = [[b,ta,a,tb],[a,tb,b,ta]];
    for (const [pos,tile,opos,other] of pairs){
      if (tile.special !== 'plane') continue;
      set.add(key(...pos));
      if (other.special==='row' || other.special==='col'){ tile.carry = other.special; other.special = 'spent'; set.add(key(...opos)); }
    }
    await resolve(set, null);
  } else {
    if (!findRuns().length){ swapCells(a,b); render(); await wait(210); busy=false; scheduleHint(); return; }
    moves--; hud();
    await resolve(null, [a,b]);
  }
  await afterMove();
}

async function resolve(initial, swapPair){
  let combo = 0;
  if (initial){ combo++; await clearCells(initial, [], combo); await gravity(); }
  while (true){
    const runs = findRuns(); if (!runs.length) break;
    combo++;
    const set = new Set(), creations = [], claimed = new Set();
    const prio = x => x.dir==='sq' ? 1 : x.cells.length>=5 ? 3 : x.cells.length===4 ? 2 : 0;
    for (const run of [...runs].sort((x,y) => prio(y)-prio(x))){
      run.cells.forEach(([r,c]) => set.add(key(r,c)));
      const sp = run.dir==='sq' ? 'plane' : run.cells.length>=5 ? 'bomb' : run.cells.length===4 ? (run.dir==='h' ? 'row' : 'col') : null;
      if (!sp || run.cells.some(([r,c]) => claimed.has(key(r,c)))) continue;
      let pos = run.cells[Math.floor(run.cells.length/2)];
      if (swapPair) for (const sw of swapPair){ if (run.cells.some(([r,c])=>r===sw[0]&&c===sw[1])){ pos=sw; break; } }
      const tile = at(...pos);
      if (!tile || tile.special || caged(...pos)) continue;
      run.cells.forEach(([r,c]) => claimed.add(key(r,c)));
      creations.push({ r:pos[0], c:pos[1], special:sp });
    }
    if (combo >= 2) if (combo === 3) tb.combo++; sfx('combo', combo); toast(t('tCombo',{n:combo}));
    await clearCells(set, creations, combo);
    await gravity();
    swapPair = null;
  }
  P().stats.bestCombo = Math.max(P().stats.bestCombo, combo);
}

async function clearCells(set, creations, combo){
  const keep = new Set(creations.map(x => key(x.r,x.c)));
  const queue = [...set], done = new Set(), planes = [];
  let bonus = 0;
  while (queue.length){
    const k = queue.pop(); if (done.has(k)) continue; done.add(k);
    if (keep.has(k)) continue;
    const r = Math.floor(k/N), c = k%N, t = at(r,c); if (!t) continue;
    if (t.special==='row'){ bonus+=60; beam('row',r); for(let i=0;i<N;i++) queue.push(key(r,i)); }
    else if (t.special==='col'){ bonus+=60; beam('col',c); for(let i=0;i<N;i++) queue.push(key(i,c)); }
    else if (t.special==='plane'){
      bonus+=80; planes.push({ from:[r,c], carry:t.carry || null });
      for (const [rr,cc] of cross(r,c)) queue.push(key(rr,cc));
    }
    else if (t.special==='bomb'){
      bonus+=120; sfx('rainbow');
      const types=[...new Set(grid.flat().filter(x=>x && x.type>=0).map(x=>x.type))];
      const pick=types[Math.floor(Math.random()*types.length)];
      for (let rr=0;rr<N;rr++) for (let cc=0;cc<N;cc++) if (tt(rr,cc)===pick) queue.push(key(rr,cc));
    }
  }
  let removed = 0; const hit = [], hitEls = [], cageHits = [];
  for (const k of done){
    if (keep.has(k)) continue;
    const r = Math.floor(k/N), c = k%N, t = at(r,c); if (!t) continue;
    if (caged(r,c)){ cageHits.push([r,c]); continue; }
    if (t.special==='key'){ continue; }
    if (t.type >= 0){ prog.color[t.type] = (prog.color[t.type]||0) + 1; tb.color[t.type] = (tb.color[t.type]||0) + 1; }
    grid[r][c] = null; removed++; hit.push([r,c]);
    const el = els.get(t.id);
    if (el){ el.classList.remove('sel','hint'); el.classList.add('shock'); els.delete(t.id); hitEls.push(el); }
  }
  hitIce(hit); hitCage(cageHits);
  const zapped = hit.concat(cageHits);
  if (zapped.length){ zap(zapped); haptic(zapped.length); await wait(170); }
  hitEls.forEach(el => { el.classList.add('pop'); setTimeout(() => el.remove(), 260); });
  for (const cr of creations){
    const t = at(cr.r,cr.c); if (!t) continue;
    t.special = cr.special; t.timer = 0; if (cr.special==='bomb' || cr.special==='plane') t.type = -1;
    if (cr.special==='bomb') P().stats.bombs++;
    P().stats.specials++;
    const el = els.get(t.id); if (el){ paint(t,el); el.classList.remove('born'); void el.offsetWidth; el.classList.add('born'); sfx('special'); }
  }
  P().stats.popped += removed; tb.popped += removed;
  score += removed*10*combo + bonus; hud();
  await wait(240);
  for (const pl of planes){
    const dest = planeTarget(); if (!dest) continue;
    sfx('plane'); await fly(pl.from, dest); sfx('land');
    P().stats.planes++; prog.planes++; tb.planes++;
    const tset = new Set(cross(...dest).map(([r,c]) => key(r,c)));
    if (pl.carry === 'row'){ beam('row',dest[0]); for (let i=0;i<N;i++) tset.add(key(dest[0],i)); }
    if (pl.carry === 'col'){ beam('col',dest[1]); for (let i=0;i<N;i++) tset.add(key(i,dest[1])); }
    await clearCells(tset, [], combo);
  }
}
/* ---------- electric effect ---------- */
let zapId = 0;
function bolt(x1,y1,x2,y2,jag){
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy) || 1, n = Math.max(3, Math.round(len/38)), nx = -dy/len, ny = dx/len;
  const pts = [[x1,y1]];
  for (let i=1;i<n;i++){ const k = i/n, o = (Math.random()*2-1)*jag; pts.push([x1+dx*k+nx*o, y1+dy*k+ny*o]); }
  pts.push([x2,y2]);
  return pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
}
function zap(cells){
  sfx('zap', cells.length);
  const id = 'zg' + (zapId++), C = ([r,c]) => [c*100+50, r*100+50];
  const rest = cells.slice(1), edges = []; let cur = cells[0];
  while (rest.length){
    let bi = 0, bd = 1e9;
    rest.forEach((p,i) => { const d = (p[0]-cur[0])**2 + (p[1]-cur[1])**2; if (d < bd){ bd = d; bi = i; } });
    const nxt = rest.splice(bi,1)[0]; edges.push([cur,nxt]); cur = nxt;
  }
  let lines = '', sparks = '', glows = '';
  for (const [a,b] of edges){ const [x1,y1] = C(a), [x2,y2] = C(b); lines += `<polyline points="${bolt(x1,y1,x2,y2,16)}"/>`; }
  for (const p of cells){
    const [x,y] = C(p);
    glows += `<circle cx="${x}" cy="${y}" r="30"/>`;
    for (let i=0;i<4;i++){
      const a = Math.random()*Math.PI*2, l1 = 10+Math.random()*8, l2 = l1+14+Math.random()*16;
      sparks += `<polyline points="${bolt(x+Math.cos(a)*l1, y+Math.sin(a)*l1, x+Math.cos(a)*l2, y+Math.sin(a)*l2, 5)}"/>`;
    }
  }
  boardEl.insertAdjacentHTML('beforeend', `<svg class="zap" viewBox="0 0 800 800" preserveAspectRatio="none" aria-hidden="true">
    <defs><filter id="${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter></defs>
    <g fill="#BFF6FF" opacity=".4" filter="url(#${id})">${glows}</g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#5CE1FF" stroke-width="14" opacity=".9" filter="url(#${id})">${lines}${sparks}</g>
      <g stroke="#B8F3FF" stroke-width="5">${lines}</g>
      <g stroke="#fff" stroke-width="2.2">${lines}${sparks}</g>
    </g></svg>`);
  const el = boardEl.lastElementChild;
  setTimeout(() => el.remove(), 420);
  boardEl.classList.remove('jolt'); void boardEl.offsetWidth; boardEl.classList.add('jolt');
}
function haptic(n){ try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(n > 6 ? 'heavy' : 'medium'); } catch(e){} }
function cross(r,c){ return [[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(inB); }
function mostCommonType(){
  const cnt = new Array(TYPES).fill(0);
  grid.flat().forEach(x => { if (x && x.type>=0) cnt[x.type]++; });
  return cnt.indexOf(Math.max(...cnt));
}
// the most useful zone: cross that hits the most special candies, otherwise the fullest cross
function planeTarget(){
  let best = 0, list = [];
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    let v = 0;
    for (const [rr,cc] of cross(r,c)){
      if (caged(rr,cc)) v += 5;
      if (iceGrid[rr] && iceGrid[rr][cc] > 0) v += 3;
      const x = at(rr,cc); if (!x) continue;
      v += x.special==='bomb' ? 12 : (x.special==='row' || x.special==='col') ? 8 : x.special==='plane' ? 6 : 1;
    }
    if (v > best){ best = v; list = [[r,c]]; } else if (v === best) list.push([r,c]);
  }
  return list.length ? list[Math.floor(Math.random()*list.length)] : null;
}
async function fly(from, to){
  const el = document.createElement('div'); el.className = 'flyer';
  el.innerHTML = `<svg viewBox="0 0 100 100">${PLANE}</svg>`;
  const ang = Math.atan2(to[0]-from[0], to[1]-from[1]) * 180/Math.PI + 90;
  el.style.transform = `translate(${from[1]*100}%,${from[0]*100}%) rotate(${ang}deg) scale(1.2)`;
  boardEl.appendChild(el); void el.offsetWidth;
  el.style.transform = `translate(${to[1]*100}%,${to[0]*100}%) rotate(${ang}deg) scale(1.2)`;
  await wait(500); el.remove();
}

async function gravity(){
  let any = false;
  for (let c=0;c<N;c++){
    const slots = []; for (let r=N-1;r>=0;r--) if (!caged(r,c)) slots.push(r);
    const tiles = slots.map(r => grid[r][c]).filter(Boolean);
    slots.forEach((r,i) => {
      if (i < tiles.length){ if (grid[r][c] !== tiles[i]) any = true; grid[r][c] = tiles[i]; return; }
      const j = i - tiles.length;
      const t = { id:nextId++, type:randType(), special:null };
      if (cfg && cfg.timers && Math.random() < 0.025 && countTimers() < 3) t.timer = cfg.timerStart;
      const kg = cfg && cfg.goals.find(g => g.k==='keys');
      if (kg && keysSpawned < kg.n && countKeys() < 2 && Math.random() < .08){ t.special = 'key'; t.type = -1; keysSpawned++; }
      grid[r][c] = t; place(makeEl(t), -1-j, c); any = true;
    });
  }
  void boardEl.offsetHeight;
  render();
  if (any) await wait(300);
  // keys that reached the bottom are collected
  const got = [];
  for (let c=0;c<N;c++){ let r = N-1; while (r >= 0 && caged(r,c)) r--; const x = r >= 0 && grid[r][c]; if (x && x.special==='key') got.push([r,c,x]); }
  if (got.length){
    for (const [r,c,x] of got){ grid[r][c] = null; prog.keys++; const el = els.get(x.id); if (el){ els.delete(x.id); el.classList.add('pop'); setTimeout(() => el.remove(), 260); } }
    sfx('unlock'); toast('🔑 +' + got.length); hud();
    await wait(260); await gravity();
  }
}
function countKeys(){ return grid.flat().filter(x => x && x.special==='key').length; }

async function shuffleBoard(){
  sfx('shuffle');
  toast(t('tShuffling'));
  const tiles = grid.flat();
  do { tiles.forEach(t => { if (!t.special) t.type = randType(); }); } while (findRuns().length || !findMove());
  tiles.forEach(t => { const el=els.get(t.id); if(el){ paint(t,el); el.classList.remove('born'); void el.offsetWidth; el.classList.add('born'); } });
  await wait(420);
}

async function afterMove(consumed = true){
  flushTasks();
  hud();
  if (goalMet()){ ended = true; win(); }
  else {
    let boom = false;
    if (consumed) grid.flat().forEach(x => {
      if (x && x.timer){ x.timer--; const el = els.get(x.id); el && paint(x, el); if (x.timer <= 0) boom = true; }
    });
    if (boom){ ended = true; haptic(10); lose('timer'); }
    else if (moves <= 0){ ended = true; lose('moves'); }
    else if (!findMove()){ await shuffleBoard(); }
  }
  busy = false;
  if (!ended){ checkAch(); scheduleHint(); }
}

function scheduleHint(){
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    if (busy || ended) return;
    const m = findMove(); if (!m) return;
    m.forEach(([r,c]) => { const el = elAt(r,c); el && el.classList.add('hint'); });
  }, 6000);
}

/* ---------- levels ---------- */
function buildConfig(){
  const L = playLv, p = P(), pl = p.pl, types = ['score'];
  if (pl >= 3) types.push('ice');
  if (pl >= 5) types.push('collect');
  if (pl >= 6) types.push('cage');
  const type = p.pending && types.includes(p.pending) ? p.pending : types[(L-1) % types.length];
  p.pending = null; save();
  const c = { type, colors: pl >= 4 ? 6 : 5, moves: Math.max(15, 20 - Math.floor((L-1)/6)), goals: [] };
  const pickColor = () => { let k; do { k = Math.floor(Math.random()*c.colors); } while (c.goals.some(g => g.k==='color' && g.c===k)); return k; };
  // main goal
  if (type==='score'){ c.target = targetFor(L); c.goals.push({ k:'score', n:c.target }); }
  if (type==='ice'){ c.ice = Math.min(28, 8 + L); c.ice2 = pl >= 7; c.moves += 2; c.goals.push({ k:'ice' }); }
  if (type==='cage'){ c.cages = Math.min(16, 6 + Math.floor(L/2)); c.moves += 2; c.goals.push({ k:'cage' }); }
  if (type==='collect') c.goals.push({ k:'color', c:pickColor(), n:Math.min(40, 16 + L*2) });
  // extra goals grow with player level
  const extra = pl < 2 ? 0 : pl < 5 ? 1 : 2;
  const pool = ['color','color'];
  if (pl >= 2) pool.push('planes');
  if (pl >= 4) pool.push('keys');
  for (let i=0;i<extra;i++){
    if (Math.random() < (i===0 ? .85 : .5)){
      const k = pool[Math.floor(Math.random()*pool.length)];
      if (k==='color') c.goals.push({ k:'color', c:pickColor(), n:8 + Math.min(14, L) });
      else if (k==='planes' && !c.goals.some(g => g.k==='planes')) c.goals.push({ k:'planes', n:Math.min(4, 1 + Math.floor(L/8)) });
      else if (k==='keys' && !c.goals.some(g => g.k==='keys')) c.goals.push({ k:'keys', n:Math.min(3, 1 + Math.floor(L/10)) });
      c.moves += 2;
    }
  }
  if (type==='score' && c.goals.length > 1){ c.target = Math.round(c.target*.7); c.goals[0].n = c.target; }
  if (pl >= 8 && L % 2 === 0){ c.timers = 2; c.timerStart = Math.max(8, 14 - (pl-8)); }
  return c;
}
let prog = { color:{}, planes:0, keys:0 }, keysSpawned = 0;
const tb = { color:{}, popped:0, ice:0, planes:0, combo:0 };
function flushTasks(){
  for (const c in tb.color){ if (tb.color[c]) taskBump('color', tb.color[c], +c); tb.color[c] = 0; }
  for (const k of ['popped','ice','planes','combo']){ if (tb[k]) taskBump(k, tb[k]); tb[k] = 0; }
}
function goalProgress(g){
  if (g.k==='score') return [Math.min(score, g.n), g.n];
  if (g.k==='ice') return [iceTotal - iceLeft(), iceTotal];
  if (g.k==='cage') return [cageTotal - cageLeft(), cageTotal];
  if (g.k==='color') return [Math.min(prog.color[g.c]||0, g.n), g.n];
  if (g.k==='planes') return [Math.min(prog.planes, g.n), g.n];
  if (g.k==='keys') return [Math.min(prog.keys, g.n), g.n];
  return [0,1];
}
const goalDone = g => { const [a,b] = goalProgress(g); return a >= b; };
function goalIcon(g){
  if (g.k==='score') return '⭐';
  if (g.k==='ice') return '❄️';
  if (g.k==='cage') return CAGE_SVG;
  if (g.k==='color') return `<svg viewBox="0 0 100 100">${candy(g.c)}</svg>`;
  if (g.k==='planes') return `<svg viewBox="0 0 100 100"><g transform="rotate(45 50 50)">${PLANE}</g></svg>`;
  if (g.k==='keys') return KEY_SVG;
}

function initCage(){

function hitCage(cells){

function hitIce(cells){

function startLevel(){

function win(){

/* ---------- input ---------- */
function cellAt(e){
  const r = boardEl.getBoundingClientRect();
  const c = Math.floor((e.clientX-r.left)/r.width*N), rr = Math.floor((e.clientY-r.top)/r.height*N);
  return inB([rr,c]) ? [rr,c] : null;
}
function tap(cell){
  if (selected){
    if (selected[0]===cell[0] && selected[1]===cell[1]){ setSel(null); return; }
    if (Math.abs(selected[0]-cell[0]) + Math.abs(selected[1]-cell[1]) === 1){ attemptSwap(selected, cell); return; }
  }
  const x = at(...cell);
  if (caged(...cell)){ setSel(null); nope(cell); toast(t('tCaged')); return; }
  if (x && x.special === 'plane'){ launchPlane(cell); return; }
  setSel(cell); scheduleHint();
}
async function launchPlane(cell){
  if (busy || ended || moves<=0) return;
  busy = true; clearHint(); setSel(null);
  moves--; hud();
  await resolve(new Set([key(...cell)]), null);
  await afterMove();
}
boardEl.addEventListener('pointerdown', e => {
  if (busy || ended) return;
  const cell = cellAt(e); if (!cell) return;
  if (tool){ useTool(cell); return; }
  drag = { cell, x:e.clientX, y:e.clientY, moved:false };
  try { boardEl.setPointerCapture(e.pointerId); } catch(err){}
});
boardEl.addEventListener('pointermove', e => {
  if (!drag || drag.moved) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  const th = boardEl.getBoundingClientRect().width/N*0.3;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < th) return;
  drag.moved = true;
  const d = Math.abs(dx) > Math.abs(dy) ? [0,Math.sign(dx)] : [Math.sign(dy),0];
  attemptSwap(drag.cell, [drag.cell[0]+d[0], drag.cell[1]+d[1]]);
});
boardEl.addEventListener('pointerup', () => { if (drag && !drag.moved) tap(drag.cell); drag = null; });
boardEl.addEventListener('pointercancel', () => { drag = null; });

const WHEEL = [
  { kind:'coins', n:10, col:'#FF3B5C' }, { kind:'coins', n:30, col:'#FFC21A' }, { kind:'stars', n:1, col:'#3FD45A' }, { kind:'coins', n:20, col:'#2F8CFF' },

const WHEEL_W = [22, 16, 14, 20, 9, 22, 3, 4];
const wheelAvailable = () => state.wheelDay !== today();
function wheelSVG(){
  const n = WHEEL.length, R = 100; let g = '';

  if (state.daily && state.daily.date === today()) return state.daily.tasks;
  const rnd = dayRand('t'), pl = P().pl, pool = [
    () => ({ k:'color', c:Math.floor(rnd()*5), n:40 + Math.floor(rnd()*4)*10, r:30 }),
    () => ({ k:'wins', n:2 + Math.floor(rnd()*3), r:40 }),
    () => ({ k:'combo', n:3 + Math.floor(rnd()*3), r:30 }),
    () => ({ k:'popped', n:150 + Math.floor(rnd()*4)*50, r:30 })

}

// calm lo-fi: warm jazzy 7th chords, soft bass, brushed hats, sparse melody
const CHORDS = [[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];   // Fmaj7, Em7, Dm7, Cmaj7

    case 'unlock': tone(D, hz(76), t, .2, { vol:.1 }); tone(D, hz(83), t+.1, .2, { vol:.1 }); tone(D, hz(88), t+.2, .6, { vol:.12 }); break;
    case 'open': tone(D, 600, t, .08, { vol:.06, type:'triangle', to:900 }); break;
  }
}
const SPK_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="m16 9 5 6M21 9l-5 6"/></svg>';
function renderSound(){ const b = $('#soundBtn'); if (b){ b.innerHTML = state.music ? SPK_ON : SPK_OFF; b.setAttribute('aria-pressed', state.music ? 'true' : 'false'); } }

function boot(){ normalizeState(); if (state.music === undefined) state.music = true; if (state.sfx === undefined) state.sfx = true; playLv = state.level; applyBg(); applySkin(); applyLang(); renderSound(); startLevel(); showScreen('menu'); checkReferral(); loadCloudAvatar();
  if (dailyAvailable() && state.dailyShown !== today()){ state.dailyShown = today(); save(); setTimeout(() => { if (!overlay.classList.contains('open')) openDaily(); }, 900); } }
if (cloud){
  let done = false;
  const go = () => { if (!done){ done = true; boot(); } };
  setTimeout(go, 1500);
  try {
    cloud.getItem(KEY, (err, val) => {
      if (!err && val){ try { const c = JSON.parse(val); if (c && (c.savedAt||0) > (state.savedAt||0)){ state = c; normalizeState(); } } catch(e){} }
      go();
    });
  } catch(e){ go(); }
} else boot();
