<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sugar Shock</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEE8FF; --surface:#FFFFFF; --ink:#231B4F; --muted:#6C6495; --line:#D8CFF7;
  --board:#2B2263; --cell:#342A74; --track:#DCD3FA; --gold:#FFB627; --gold-ink:#4A2F00; --danger:#E8344F;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120E2C; --surface:#1E1846; --ink:#F3EFFF; --muted:#A79FD3; --line:#2F2868;
    --board:#231B56; --cell:#2C236A; --track:#2E2766; --danger:#FF5C76; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120E2C; --surface:#1E1846; --ink:#F3EFFF; --muted:#A79FD3; --line:#2F2868;
  --board:#231B56; --cell:#2C236A; --track:#2E2766; --danger:#FF5C76; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:14px;padding:14px 14px 16px}
.top{display:flex;align-items:center;justify-content:space-between}
.title{font-weight:900;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.title .bolt{display:inline-block;font-size:.85em;filter:drop-shadow(0 0 6px rgba(255,194,26,.7));animation:boltFlick 3.2s infinite}
@keyframes boltFlick{0%,86%,100%{opacity:1}88%{opacity:.35}90%{opacity:1}92%{opacity:.5}94%{opacity:1}}
@media (prefers-reduced-motion: reduce){ .title .bolt{animation:none} }
.title small{display:block;font-weight:600;font-size:14px;color:var(--muted);letter-spacing:0}
.top-left{display:flex;align-items:center;gap:12px}
.avatar-btn{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;flex:none}
.avatar{position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;background:var(--av,#7A5CFF);flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.lg{width:72px;height:72px;font-size:28px}
.avatar-btn .lvl{position:absolute;right:-5px;bottom:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg)}
.avatar-btn .dot{position:absolute;right:-1px;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--danger);border:2px solid var(--bg);display:none}
.avatar-btn.has-daily .dot{display:block}
.sheet{max-height:88vh;overflow:auto}
.prof-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.prof-name{font-size:22px;font-weight:900;line-height:1.15}
.prof-rank{color:var(--muted);font-weight:700;font-size:14px}
.xp-row{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px}
.xp-row span{color:var(--muted)}
.daily{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:16px 0}
.daily b{display:block;font-size:16px}
.daily small{color:var(--muted);font-weight:600;font-size:13px}
.daily .btn{width:auto;padding:10px 14px;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--track);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:700;line-height:1.2}
.section-title{font-weight:900;font-size:17px;margin:0 0 10px}
.ach-list{display:grid;gap:8px;margin-bottom:6px}
.ach{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line)}
.ach .ico{font-size:22px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--track);flex:none}
.ach.locked .ico{filter:grayscale(1);opacity:.45}
.ach.locked .ach-name{color:var(--muted)}
.ach-name{font-weight:800;font-size:15px}
.ach-desc{font-size:13px;color:var(--muted);font-weight:600}
.ach-rew{margin-left:auto;font-weight:800;font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.ach-rew .coin{width:16px;height:16px}
.ach.done .ach-rew{color:var(--muted)}
.notice{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(35,27,79,.25);transition:transform .3s ease;max-width:calc(100% - 24px);text-align:center}
.notice.show{transform:translate(-50%,0)}
.top-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px}
.field{margin-bottom:18px}
.field-label{font-weight:800;font-size:15px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--track);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;color:var(--ink);padding:11px 4px;border-radius:10px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 6px rgba(35,27,79,.18)}
.coins{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;font-weight:800;font-size:17px}
.coins .plus{width:32px;height:32px;border-radius:50%;border:0;background:var(--gold);color:var(--gold-ink);font:inherit;font-size:22px;line-height:1;font-weight:900;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.goal-text{font-weight:800;font-size:16px}
.goal-text span{color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#FF8A2B,var(--gold));transition:width .35s ease}
.moves{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 16px;text-align:center;min-width:84px}
.moves b{display:block;font-size:30px;font-weight:900;line-height:1.05}
.moves span{font-size:13px;color:var(--muted);font-weight:600}
.moves.low b{color:var(--danger)}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board-frame{
  width:min(100%,58vh);aspect-ratio:1/1;padding:10px;border-radius:26px;
  background:#231E30 center/cover no-repeat;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -4px 0 rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.4),0 14px 34px rgba(20,14,40,.4);
}
.board-frame[data-skin="classic"]{padding:0;background:none;box-shadow:none;border-radius:22px}
.board-frame[data-skin="classic"] .board{border-radius:22px;background:repeating-conic-gradient(var(--cell) 0 25%,transparent 0 50%) 0 0/25% 25% var(--board);box-shadow:0 10px 30px rgba(35,27,79,.25)}
.board-frame[data-skin="wood"]{background-color:#2A190F}
.board-frame[data-skin="stars"]{background-color:#121632;box-shadow:inset 0 0 0 2px rgba(232,196,106,.55),inset 0 -4px 0 rgba(0,0,0,.5),0 14px 34px rgba(20,14,40,.4)}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:420px){ .skins.bg5{grid-template-columns:repeat(5,1fr)} }
.skin{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 4px 8px;border-radius:14px;border:2px solid transparent;background:var(--track);color:var(--ink);font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.skin[aria-pressed="true"]{border-color:var(--gold);background:var(--surface)}
.gstar{width:18px;height:18px;vertical-align:-3px}
.win-stars{display:flex;justify-content:center;gap:10px;margin:2px 0 14px}
.win-stars .gstar{width:54px;height:54px}
.win-stars .on{animation:starIn .45s ease-out both}
.win-stars .on:nth-child(2){animation-delay:.15s}
.win-stars .on:nth-child(3){animation-delay:.3s}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:none}}
.wallet{display:flex;align-items:center;gap:6px;font-weight:800;margin:-4px 0 16px;color:var(--ink)}
.ptag{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted)}
.ptag .gstar{width:14px;height:14px;vertical-align:0}
.sw{position:relative}
.sw.locked::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;background:rgba(10,6,30,.45);border-radius:10px}
.sw-bg{background-color:var(--bg)}
.unlock-prev{width:120px;aspect-ratio:1/1;border-radius:18px;margin:0 auto 14px;background-color:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.sw{display:block;width:100%;aspect-ratio:1/1;border-radius:10px;background-color:#231E30;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.board{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;touch-action:none;
  background:#231E30 0 0/100% 100% no-repeat;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.55),0 0 0 2px rgba(0,0,0,.4);
}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .26s cubic-bezier(.3,.7,.4,1);will-change:transform;cursor:pointer}
.piece{width:100%;height:100%;padding:8%;transition:transform .2s ease,opacity .2s ease}
.piece svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28))}
.tile.sel .piece{transform:scale(1.14)}
.tile.sel::after{content:"";position:absolute;inset:3%;border-radius:24%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
.tile.pop .piece{transform:scale(0) rotate(40deg);opacity:0}
.tile.hint .piece{animation:wiggle .9s ease-in-out infinite}
.tile.born .piece{animation:born .38s ease-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg) scale(1.06)}75%{transform:rotate(11deg) scale(1.06)}}
@keyframes born{0%{transform:scale(.4)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
.beam{position:absolute;pointer-events:none;z-index:5;background:rgba(255,255,255,.85);border-radius:99px;box-shadow:0 0 18px 6px rgba(255,255,255,.6)}
.beam.row{left:0;right:0;height:12.5%;animation:beamRow .42s ease-out forwards}
.beam.col{top:0;bottom:0;width:12.5%;animation:beamCol .42s ease-out forwards}
@keyframes beamRow{from{opacity:1;transform:scaleY(.25)}to{opacity:0;transform:scaleY(.9)}}
@keyframes beamCol{from{opacity:1;transform:scaleX(.25)}to{opacity:0;transform:scaleX(.9)}}
.flyer{position:absolute;left:0;top:0;width:12.5%;height:12.5%;z-index:7;pointer-events:none;padding:4%;transition:transform .48s cubic-bezier(.45,0,.3,1)}
.flyer svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 5px rgba(0,0,0,.35))}
@media (prefers-reduced-motion: reduce){ .flyer{transition-duration:.12s} }
.tile.shock .piece{animation:shock .17s steps(2) infinite}
.tile.shock.pop .piece{animation:none}
@keyframes shock{0%{filter:brightness(2.3) saturate(1.6);transform:translate(1.5px,-1px) scale(1.07)}50%{filter:brightness(1.3);transform:translate(-1.5px,1px) scale(1.02)}100%{filter:brightness(2.5);transform:translate(1px,1.5px) scale(1.08)}}
.zap{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;animation:zapFlicker .38s linear forwards}
@keyframes zapFlicker{0%{opacity:1}15%{opacity:.3}30%{opacity:1}50%{opacity:.55}65%{opacity:1}100%{opacity:0}}
.board.jolt{animation:jolt .2s}
@keyframes jolt{0%,100%{transform:none}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,1px)}}
@media (prefers-reduced-motion: reduce){ .tile.shock .piece{animation:none;filter:brightness(1.8)} .board.jolt{animation:none} .zap{animation-duration:.25s} }
.toast{position:absolute;left:50%;top:44%;z-index:6;transform:translate(-50%,-50%);pointer-events:none;
  font-weight:900;font-size:clamp(20px,6vw,30px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap;opacity:0;text-align:center}
.toast.show{animation:toast 1.1s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.boosters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.booster.locked{opacity:.55}
.booster.locked .price{font-size:12px}
.ice{position:absolute;width:12.5%;height:12.5%;z-index:3;pointer-events:none;padding:3%}
.ice::before{content:"";display:block;width:100%;height:100%;border-radius:20%;background:linear-gradient(135deg,rgba(225,247,255,.55),rgba(150,215,255,.25));border:2px solid rgba(255,255,255,.75);box-shadow:inset 0 0 10px rgba(255,255,255,.55)}
.ice.hp2::before{background:linear-gradient(135deg,rgba(230,248,255,.82),rgba(165,222,255,.5));border-width:3px}
.ice.crack{animation:crack .3s}
.cage{position:absolute;width:12.5%;height:12.5%;z-index:4;pointer-events:none;padding:2%}
.cage svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.cage.gone{animation:cageGone .34s forwards}
@keyframes cageGone{30%{transform:scale(1.15) rotate(-6deg)}100%{transform:scale(.4) rotate(18deg);opacity:0}}
.tile.nope .piece{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ice.gone{animation:iceGone .32s forwards}
@keyframes crack{50%{transform:scale(1.12);opacity:.6}}
@keyframes iceGone{to{transform:scale(1.35);opacity:0}}
.gi{display:inline-block;width:22px;height:22px;vertical-align:-5px}
.gi svg{width:100%;height:100%}
.ach.next{border-color:var(--gold);border-width:2px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--track);color:var(--ink);font:inherit;font-size:22px;font-weight:900;cursor:pointer}
.stepper b{font-size:22px;min-width:28px;text-align:center}
.hint-note{display:block;color:var(--muted);font-size:13px;margin-top:8px;font-weight:600}
.booster{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:9px 4px;color:var(--ink);font:inherit;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.booster svg.ic{width:26px;height:26px}
.booster .price{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center;font-weight:700}
.booster.active{box-shadow:0 0 0 3px var(--gold);border-color:var(--gold)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(10,6,30,.55);
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.open{display:flex}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:24px;padding:22px;animation:sheet .25s ease-out}
@keyframes sheet{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:24px;font-weight:900}
.sheet p{margin:0 0 16px;color:var(--muted);font-size:15px;line-height:1.5}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.packs{display:grid;gap:10px;margin-bottom:4px}
.pack{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.pack-coins{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px}
.pack-tag{font-size:12px;font-weight:800;color:var(--gold-ink);background:var(--gold);border-radius:99px;padding:2px 8px}
.pack-price{font-weight:800;font-size:16px;background:var(--track);border-radius:12px;padding:6px 12px}
.coin{width:20px;height:20px;flex:none}
@media (prefers-reduced-motion: reduce){
  .win-stars .on{animation:none}
  .tile{transition-duration:.05s}
  .tile.hint .piece,.tile.born .piece,.sheet{animation:none}
  .beam{animation-duration:.2s}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <button class="avatar-btn" id="profileBtn" data-i18n-aria="profile"><span class="avatar" id="avatarSm"></span><span class="lvl" id="plBadge">1</span><span class="dot"></span></button>
      <div class="title"><span data-i18n="appTitle">Sugar Shock</span> <span class="bolt" aria-hidden="true">⚡</span><small id="level"></small></div>
    </div>
    <div class="top-right">
      <div class="coins"><span class="coin-ic"></span><span id="coins">0</span><button class="plus" id="plus" data-i18n-aria="topUp">+</button></div>
      <button class="icon-btn" id="settings" data-i18n-aria="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <section class="stats">
    <div class="goal">
      <div class="goal-text" id="goal"></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="moves" id="movesBox"><b id="moves">20</b><span id="movesLabel"></span></div>
  </section>

  <main class="board-wrap">
    <div class="board-frame" id="boardFrame"><div class="board" id="board" data-i18n-aria="board"><div class="toast" id="toast"></div></div></div>
  </main>

  <nav class="boosters">
    <button class="booster" id="bShuffle" data-cost="30" data-need="4">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4l9 10h5M3 17h4l2.5-2.8M14.5 9.8 16 7h5M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
      <span data-i18n="shuffle"></span><span class="price"><span class="coin-ic"></span>30</span>

const FULL = 'width="800" height="800"';
function squaresSVG(o){
  let light = '', bevel = '', grout = '';

    const x = c*100, y = r*100;
    if ((r+c)%2===0) light += `<rect x="${x}" y="${y}" width="100" height="100"/>`;
    bevel += `<path d="M${x+2} ${y+97} V${y+2} H${x+97}"/>`;
    grout += `<path d="M${x+3} ${y+98} H${x+98} V${y+3}"/>`;
  }
  const lg = (id, [a,b]) => `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="none"><defs><clipPath id="L">${light}</clipPath>${o.defs||''}${lg('dk',o.dk)}${lg('lt',o.lt)}</defs>
    <rect ${FULL} fill="url(#dk)"/>${o.under||''}<g clip-path="url(#L)"><rect ${FULL} fill="url(#lt)"/>${o.over||''}</g>${o.top||''}
    <g fill="none" stroke="#fff" stroke-opacity="${o.bevel}" stroke-width="3">${bevel}</g>

}

    stops.map((c,i) => `<stop offset="${i/(stops.length-1)}" stop-color="${c}"/>`).join('')}</linearGradient></defs>
    <rect width="400" height="400" fill="url(#fg)"/>${extra||''}</svg>`;
}

function genBoard(){

    grid = [];

      grid.push([]);
      for (let c=0;c<N;c++){
        let t;
        do { t = randType(); } while ((c>=2 && grid[r][c-1].type===t && grid[r][c-2].type===t) || (r>=2 && grid[r-1][c].type===t && grid[r-2][c].type===t) || (r>=1 && c>=1 && grid[r-1][c].type===t && grid[r][c-1].type===t && grid[r-1][c-1].type===t));

  for (let c=0;c<N;c++){ let r=0; while(r<N){ const t=tt(r,c); let e=r+1; if(t>=0) while(e<N && tt(e,c)===t) e++;
    if (t>=0 && e-r>=3){ const cells=[]; for(let k=r;k<e;k++) cells.push([k,c]); runs.push({dir:'v',cells}); } r=e; } }
  for (let r=0;r<N-1;r++) for (let c=0;c<N-1;c++){

}
function swapCells(a,b){ const t=grid[a[0]][a[1]]; grid[a[0]][a[1]]=grid[b[0]][b[1]]; grid[b[0]][b[1]]=t; }
function findMove(){

    if (x.special === 'bomb' || x.special === 'plane'){ const nb = [[r,c+1],[r,c-1],[r+1,c],[r-1,c]].find(p => inB(p) && !caged(...p)); if (nb) return [[r,c], nb]; continue; }

/* ---------- turn flow ---------- */
function nope(cell){ const el = elAt(...cell); if (!el) return; el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); }
async function attemptSwap(a,b){
  if (busy || ended || moves<=0 || !inB(b)) return;
  if (caged(...a) || caged(...b)){ setSel(null); nope(caged(...a) ? a : b); toast(t('tCaged')); return; }
  busy = true; clearHint(); setSel(null);
  swapCells(a,b); render(); await wait(210);
  const ta = grid[b[0]][b[1]], tb = grid[a[0]][a[1]];
  if (ta.special==='bomb' || tb.special==='bomb'){
    moves--; hud();
    const set = new Set();
    if (ta.special==='bomb' && tb.special==='bomb'){
      for (let r=0;r<N;r++) for (let c=0;c<N;c++) set.add(key(r,c));
      ta.special = tb.special = 'spent';
    } else {
      const [bp, bombTile, other] = ta.special==='bomb' ? [b,ta,tb] : [a,tb,ta];
      bombTile.special = 'spent';
      set.add(key(...bp));
      set.add(key(...a)); set.add(key(...b));
      const ot = other.type >= 0 ? other.type : mostCommonType();
      for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (tt(r,c)===ot) set.add(key(r,c));
      if (other.special==='row' || other.special==='col'){
        set.forEach(k=>{ const t=at(Math.floor(k/N),k%N); if(t && t.type>=0) t.special = Math.random()<.5?'row':'col'; });
      }
    }
    toast(t('tBoom'));
    await resolve(set, null);
  } else if (ta.special==='plane' || tb.special==='plane'){
    moves--; hud();
    const set = new Set();
    const pairs = [[b,ta,a,tb],[a,tb,b,ta]];
    for (const [pos,tile,opos,other] of pairs){
      if (tile.special !== 'plane') continue;
      set.add(key(...pos));
      if (other.special==='row' || other.special==='col'){ tile.carry = other.special; other.special = 'spent'; set.add(key(...opos)); }
    }
    await resolve(set, null);
  } else {
    if (!findRuns().length){ swapCells(a,b); render(); await wait(210); busy=false; scheduleHint(); return; }
    moves--; hud();
    await resolve(null, [a,b]);
  }
  await afterMove();
}

async function resolve(initial, swapPair){
  let combo = 0;
  if (initial){ combo++; await clearCells(initial, [], combo); await gravity(); }
  while (true){
    const runs = findRuns(); if (!runs.length) break;
    combo++;
    const set = new Set(), creations = [], claimed = new Set();
    const prio = x => x.dir==='sq' ? 1 : x.cells.length>=5 ? 3 : x.cells.length===4 ? 2 : 0;
    for (const run of [...runs].sort((x,y) => prio(y)-prio(x))){
      run.cells.forEach(([r,c]) => set.add(key(r,c)));
      const sp = run.dir==='sq' ? 'plane' : run.cells.length>=5 ? 'bomb' : run.cells.length===4 ? (run.dir==='h' ? 'row' : 'col') : null;
      if (!sp || run.cells.some(([r,c]) => claimed.has(key(r,c)))) continue;
      let pos = run.cells[Math.floor(run.cells.length/2)];
      if (swapPair) for (const sw of swapPair){ if (run.cells.some(([r,c])=>r===sw[0]&&c===sw[1])){ pos=sw; break; } }
      const tile = at(...pos);
      if (!tile || tile.special || caged(...pos)) continue;
      run.cells.forEach(([r,c]) => claimed.add(key(r,c)));
      creations.push({ r:pos[0], c:pos[1], special:sp });
    }
    if (combo >= 2) toast(t('tCombo',{n:combo}));
    await clearCells(set, creations, combo);
    await gravity();
    swapPair = null;
  }
  P().stats.bestCombo = Math.max(P().stats.bestCombo, combo);
}

async function clearCells(set, creations, combo){

  let bonus = 0;

    const k = queue.pop(); if (done.has(k)) continue; done.add(k);
    if (keep.has(k)) continue;
    const r = Math.floor(k/N), c = k%N, t = at(r,c); if (!t) continue;
    if (t.special==='row'){ bonus+=60; beam('row',r); for(let i=0;i<N;i++) queue.push(key(r,i)); }
    else if (t.special==='col'){ bonus+=60; beam('col',c); for(let i=0;i<N;i++) queue.push(key(i,c)); }
    else if (t.special==='plane'){

      const types=[...new Set(grid.flat().filter(x=>x && x.type>=0).map(x=>x.type))];
      const pick=types[Math.floor(Math.random()*types.length)];
      for (let rr=0;rr<N;rr++) for (let cc=0;cc<N;cc++) if (tt(rr,cc)===pick) queue.push(key(rr,cc));
    }

  for (const k of done){

    const r = Math.floor(k/N), c = k%N, t = at(r,c); if (!t) continue;
    if (caged(r,c)){ cageHits.push([r,c]); continue; }
    if (cfg && cfg.type==='collect' && t.type===cfg.ctype) collected++;
    grid[r][c] = null; removed++; hit.push([r,c]);
    const el = els.get(t.id);
    if (el){ el.classList.remove('sel','hint'); el.classList.add('shock'); els.delete(t.id); hitEls.push(el); }
  }
  hitIce(hit); hitCage(cageHits);
  const zapped = hit.concat(cageHits);
  if (zapped.length){ zap(zapped); haptic(zapped.length); await wait(170); }
  hitEls.forEach(el => { el.classList.add('pop'); setTimeout(() => el.remove(), 260); });

    const t = at(cr.r,cr.c); if (!t) continue;

  }

  await wait(240);
  for (const pl of planes){
    const dest = planeTarget(); if (!dest) continue;
    await fly(pl.from, dest);
    P().stats.planes++;
    const tset = new Set(cross(...dest).map(([r,c]) => key(r,c)));
    if (pl.carry === 'row'){ beam('row',dest[0]); for (let i=0;i<N;i++) tset.add(key(dest[0],i)); }
    if (pl.carry === 'col'){ beam('col',dest[1]); for (let i=0;i<N;i++) tset.add(key(i,dest[1])); }
    await clearCells(tset, [], combo);
  }
}
/* ---------- electric effect ---------- */

  const pts = [[x1,y1]];

function zap(cells){

    const [x,y] = C(p);
    glows += `<circle cx="${x}" cy="${y}" r="30"/>`;
    for (let i=0;i<4;i++){
      const a = Math.random()*Math.PI*2, l1 = 10+Math.random()*8, l2 = l1+14+Math.random()*16;
      sparks += `<polyline points="${bolt(x+Math.cos(a)*l1, y+Math.sin(a)*l1, x+Math.cos(a)*l2, y+Math.sin(a)*l2, 5)}"/>`;

    <defs><filter id="${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter></defs>

async function fly(from, to){

async function gravity(){

  for (let c=0;c<N;c++){
    const slots = []; for (let r=N-1;r>=0;r--) if (!caged(r,c)) slots.push(r);
    const tiles = slots.map(r => grid[r][c]).filter(Boolean);
    slots.forEach((r,i) => {
      if (i < tiles.length){ if (grid[r][c] !== tiles[i]) any = true; grid[r][c] = tiles[i]; return; }
      const j = i - tiles.length;
      const t = { id:nextId++, type:randType(), special:null };

async function shuffleBoard(){

  tiles.forEach(t => { const el=els.get(t.id); if(el){ paint(t,el); el.classList.remove('born'); void el.offsetWidth; el.classList.add('born'); } });
  await wait(420);

  if (goalMet()){ ended = true; win(); }
  else {
    let boom = false;
    if (consumed) grid.flat().forEach(x => {
      if (x && x.timer){ x.timer--; const el = els.get(x.id); el && paint(x, el); if (x.timer <= 0) boom = true; }
    });
    if (boom){ ended = true; haptic(10); lose('timer'); }
    else if (moves <= 0){ ended = true; lose('moves'); }
    else if (!findMove()){ await shuffleBoard(); }
  }
  busy = false;
  if (!ended){ checkAch(); scheduleHint(); }
}

/* ---------- hints ---------- */
function scheduleHint(){
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    if (busy || ended) return;
    const m = findMove(); if (!m) return;
    m.forEach(([r,c]) => { const el = elAt(r,c); el && el.classList.add('hint'); });
  }, 6000);
}
function clearHint(){ clearTimeout(hintTimer); boardEl.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint')); }

/* ---------- levels ---------- */
function buildConfig(){
  const L = state.level, p = P(), pl = p.pl, types = ['score'];
  if (pl >= 3) types.push('ice');
  if (pl >= 5) types.push('collect');
  if (pl >= 6) types.push('cage');
  const type = p.pending && types.includes(p.pending) ? p.pending : types[(L-1) % types.length];
  p.pending = null; save();
  const c = { type, colors: pl >= 4 ? 6 : 5, moves: Math.max(15, 20 - Math.floor((L-1)/6)) };
  if (type==='score') c.target = targetFor(L);
  if (type==='ice'){ c.ice = Math.min(28, 8 + L); c.ice2 = pl >= 7; c.moves += 2; }
  if (type==='cage'){ c.cages = Math.min(16, 6 + Math.floor(L/2)); c.moves += 2; }
  if (type==='collect'){ c.ctype = Math.floor(Math.random()*c.colors); c.count = Math.min(45, 18 + L*2); }
  if (pl >= 8 && L % 2 === 0){ c.timers = 2; c.timerStart = Math.max(8, 14 - (pl-8)); }
  return c;
}
function goalMet(){
  if (!cfg) return false;
  if (cfg.type==='ice') return iceLeft() === 0;
  if (cfg.type==='cage') return cageLeft() === 0;
  if (cfg.type==='collect') return collected >= cfg.count;
  return score >= cfg.target;
}
function countTimers(){ return grid.flat().filter(x => x && x.timer).length; }
function iceLeft(){ let n = 0; for (const row of iceGrid) for (const v of row) if (v > 0) n++; return n; }
const CAGE_SVG = (() => { const p = '<rect x="9" y="9" width="82" height="82" rx="18"/><path d="M33 10 V90 M50 10 V90 M67 10 V90 M10 50 H90"/>';
  return `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><g stroke="#2A2340" stroke-width="9" opacity=".65">${p}</g><g stroke="#E3E7F0" stroke-width="4.5">${p}</g>
  <g fill="#B9C0D0">${[[9,9],[91,9],[9,91],[91,91]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="5"/>`).join('')}</g></svg>`; })();
function cageLeft(){ let n = 0; for (const row of cageGrid) for (const v of row) if (v > 0) n++; return n; }
function initCage(){
  cageGrid = Array.from({length:N}, () => Array(N).fill(0)); cageTotal = 0;
  cageEls.forEach(e => e.remove()); cageEls.clear();
  if (!cfg.cages) return;
  const cells = []; for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (!grid[r][c].timer) cells.push([r,c]);
  for (let i=0;i<cfg.cages && i<cells.length;i++){
    const j = i + Math.floor(Math.random()*(cells.length-i)); [cells[i],cells[j]] = [cells[j],cells[i]];
    const [r,c] = cells[i]; cageGrid[r][c] = 1;
    const el = document.createElement('div'); el.className = 'cage'; el.innerHTML = CAGE_SVG;
    el.style.left = (c*12.5)+'%'; el.style.top = (r*12.5)+'%';
    boardEl.appendChild(el); cageEls.set(key(r,c), el); cageTotal++;
  }
  let guard = 0;
  while (!findMove() && guard++ < 50) grid.flat().forEach(x => { if (!x.special) x.type = randType(); });
}
function hitCage(cells){
  for (const [r,c] of cells){
    if (!caged(r,c)) continue;
    cageGrid[r][c]--;
    if (cageGrid[r][c] === 0){ const el = cageEls.get(key(r,c)); if (el){ el.classList.add('gone'); cageEls.delete(key(r,c)); setTimeout(() => el.remove(), 360); } }
  }
}
function makeIce(r,c){
  const el = document.createElement('div');
  el.className = 'ice' + (iceGrid[r][c] > 1 ? ' hp2' : '');
  el.style.left = (c*12.5)+'%'; el.style.top = (r*12.5)+'%';
  boardEl.appendChild(el); iceEls.set(key(r,c), el);
}
function initIce(){
  iceGrid = Array.from({length:N}, () => Array(N).fill(0)); iceTotal = 0;
  iceEls.forEach(e => e.remove()); iceEls.clear();
  if (!cfg.ice) return;
  const cells = []; for (let r=0;r<N;r++) for (let c=0;c<N;c++) cells.push([r,c]);
  for (let i=0;i<cfg.ice;i++){
    const j = i + Math.floor(Math.random()*(cells.length-i)); [cells[i],cells[j]] = [cells[j],cells[i]];
    const [r,c] = cells[i]; iceGrid[r][c] = cfg.ice2 && Math.random() < .5 ? 2 : 1; makeIce(r,c);
  }
  iceTotal = cfg.ice;
}
function hitIce(cells){
  for (const [r,c] of cells){
    if (!iceGrid[r] || iceGrid[r][c] <= 0) continue;
    iceGrid[r][c]--;
    const el = iceEls.get(key(r,c)); if (!el) continue;
    if (iceGrid[r][c] === 0){ el.classList.add('gone'); iceEls.delete(key(r,c)); setTimeout(() => el.remove(), 330); }
    else { el.classList.remove('hp2','crack'); void el.offsetWidth; el.classList.add('crack'); }
  }
}
function startLevel(){
  ended = false; busy = false; tool = null; selected = null;
  cfg = buildConfig(); curColors = cfg.colors;
  score = 0; moves = cfg.moves; target = cfg.target || 0; collected = 0;
  els.forEach(el => el.remove()); els.clear();
  genBoard();
  if (cfg.timers){ const all = grid.flat(); for (let i=0;i<cfg.timers;i++) all[Math.floor(Math.random()*all.length)].timer = cfg.timerStart; }
  initIce(); initCage();
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) place(makeEl(grid[r][c]), r-N, c);
  void boardEl.offsetHeight;
  render(); hud(); scheduleHint();
  if (cfg.type==='ice') notify(t('tIce'));
  if (cfg.type==='collect') notify(t('tCollect',{n:cfg.count}));
  if (cfg.type==='cage') notify(t('tCage'));
  if (cfg.timers) notify(t('tTimers'));
}
function win(){
  const reward = 20 + state.level*5, doneLevel = state.level;
  state.coins += reward; state.level++; save();
  $('#coins').textContent = state.coins;
  const xp = finishGame(true);
  const ratio = moves / cfg.moves, st = ratio >= .4 ? 3 : ratio >= .2 ? 2 : 1;
  state.gstars = (state.gstars || 0) + st; save();
  lastEnd = { kind:'win', doneLevel, reward, xp, st };
  showWin();
}
function showWin(){
  const w = lastEnd;
  openSheet(`<h2>${t('winTitle',{n:w.doneLevel})}</h2>
    <div class="win-stars">${[1,2,3].map(i => STAR_SVG(i <= w.st)).join('')}</div>
    <p>${t('winText',{s:score,m:moves,mw:movesWord(moves),r:w.reward})} ${t('winStars',{n:w.st})} ${t('winXp',{x:w.xp})}</p>
    <button class="btn" data-act="next">${t('next')}</button>`);
}
function lose(reason = 'moves'){
  lastEnd = { kind:'lose', reason };
  if (reason === 'timer'){
    openSheet(`<h2>${t('timerTitle')}</h2><p>${t('loseTimer')}</p><button class="btn" data-act="retry">${t('retry')}</button>`);
    return;
  }
  const text = cfg.type==='ice' ? t('loseIce',{n:iceLeft()}) : cfg.type==='cage' ? t('loseCage',{n:cageLeft()}) : cfg.type==='collect' ? t('loseCollect',{n:cfg.count-collected}) : t('loseText',{n:cfg.target-score});
  openSheet(`<h2>${t('loseTitle')}</h2>
    <p>${text}</p>
    <button class="btn" data-act="extra">${t('extra')}</button>
    <button class="btn ghost" data-act="retry">${t('retry')}</button>`);
}
function showEnd(){ if (lastEnd && lastEnd.kind==='win') showWin(); else lose(lastEnd ? lastEnd.reason : 'moves'); }
function openSettings(){
  const grid = (kind, ids, cur) => `<div class="skins${ids.length===5?' bg5':''}">${ids.map(id => { const own = owns(kind,id);
    return `<button class="skin" data-act="pick" data-kind="${kind}" data-v="${id}" aria-pressed="${cur===id}"><span class="sw${own?'':' locked'}" data-kind="${kind}" data-sw="${id}"></span>${itemName(kind,id)}${own ? '' : `<span class="ptag">${STAR_SVG()}${PRICES[kind][id]}</span>`}</button>`; }).join('')}</div>`;
  const seg = (name, items) => `<div class="seg" role="group">${items.map(([v,l])=>`<button data-act="${name}" data-v="${v}" aria-pressed="${state[name]===v}">${l}</button>`).join('')}</div>`;
  openSheet(`<h2>${t('settings')}</h2>
    <div class="field"><div class="field-label">${t('language')}</div>${seg('lang', Object.entries(LANGS))}</div>
    <div class="field"><div class="field-label">${t('theme')}</div>${seg('theme', [['auto',t('themeAuto')],['light',t('themeLight')],['dark',t('themeDark')]])}</div>
    <div class="wallet">${STAR_SVG()} ${t('youHave',{n:state.gstars||0, w:starsWord(state.gstars||0)})}</div>
    <div class="field"><div class="field-label">${t('boardSkin')}</div>${grid('board', Object.keys(SKINS), state.skin)}</div>
    <div class="field"><div class="field-label">${t('appBg')}</div>${grid('bg', Object.keys(BGS), state.bg)}</div>
    <button class="btn" data-act="closeSettings">${t('done')}</button>`);
  sheet.querySelectorAll('[data-sw]').forEach(el => paintSwatch(el, el.dataset.kind, el.dataset.sw));
}

/* ---------- coins & shop ---------- */
function spend(cost){
  if (state.coins < cost){ openShop(t('noCoins')); return false; }
  state.coins -= cost; save(); hud(); return true;
}
function openShop(msg){
  openSheet(`<h2>${t('shopTitle')}</h2>
    <p>${msg || t('shopText')}</p>
    <div class="packs">${PACKS.map((p,i)=>`<button class="pack" data-act="buy" data-i="${i}">
      <span class="pack-coins">${COIN}${p.coins}${p.tag?` <span class="pack-tag">${t(p.tag)}</span>`:''}</span>
      <span class="pack-price">${p.stars} ⭐</span></button>`).join('')}</div>
    <button class="btn ghost" data-act="close">${t('close')}</button>`);
}
let paying = false;
async function startPurchase(i){
  if (paying) return;
  if (!tg || !tg.initData || !tg.openInvoice || !PAY_API){
    openSheet(`<h2>${t('shopTitle')}</h2><p>${t('payOnlyTg')}</p><button class="btn ghost" data-act="shop">${t('back')}</button>`);
    return;
  }
  paying = true; notify(t('payOpening'));
  try {
    const r = await fetch(PAY_API.replace(/\/$/,'') + '/invoice', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg.initData, pack: i })
    });
    const d = await r.json();
    if (!r.ok || !d.link) throw new Error('no invoice');
    tg.openInvoice(d.link, status => {
      paying = false;
      if (status === 'paid'){
        state.coins += PACKS[i].coins; P().stats.purchases++; save(); hud(); checkAch(); closeAfterShop();
        notify(t('tCoins',{n:PACKS[i].coins}));
        try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
      }
      else if (status === 'failed') notify(t('payFailed'));
      else if (status === 'pending') notify(t('payPending'));
    });
  } catch(e){ paying = false; notify(t('payError')); }
}
function closeAfterShop(){
  if (ended && !goalMet() && moves <= 0 && !(lastEnd && lastEnd.reason==='timer')) lose('moves');
  else if (ended) showEnd();
  else closeSheet();
}
function openSheet(html){ sheet.innerHTML = html; overlay.classList.add('open'); const b = sheet.querySelector('button'); b && b.focus(); }
function closeSheet(){ overlay.classList.remove('open'); }

sheet.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act==='next'){ closeSheet(); startLevel(); }
  else if (act==='retry'){ finishGame(false); closeSheet(); startLevel(); }
  else if (act==='daily') claimDaily();
  else if (act==='closeProfile'){ if (ended) showEnd(); else closeSheet(); }
  else if (act==='extra'){ if (spend(COST.moves)){ moves += 5; ended = false; closeSheet(); hud(); scheduleHint(); } }
  else if (act==='buy') startPurchase(i);
  else if (act==='shop') openShop();
  else if (act==='close') closeAfterShop();
  else if (act==='lang'){ state.lang = b.dataset.v; save(); applyLang(); openSettings(); }
  else if (act==='pick'){
    const kind = b.dataset.kind, id = b.dataset.v;
    if (!owns(kind,id)){ openUnlock(kind,id); return; }
    if (kind==='board'){ state.skin = id; applySkin(); } else { state.bg = id; applyBg(); }
    save(); openSettings();
  }
  else if (act==='unlock'){
    const kind = b.dataset.kind, id = b.dataset.v, price = PRICES[kind][id];
    if ((state.gstars||0) < price) return;
    state.gstars -= price; state.owned = state.owned || {}; state.owned[kind+':'+id] = true;
    if (kind==='board'){ state.skin = id; applySkin(); } else { state.bg = id; applyBg(); }
    save(); notify(t('nUnlock',{name:itemName(kind,id)})); openSettings();
  }
  else if (act==='settings') openSettings();
  else if (act==='theme'){ state.theme = b.dataset.v; save(); applyTheme(); openSettings(); }
  else if (act==='closeSettings'){ if (ended) showEnd(); else closeSheet(); }
});
overlay.addEventListener('click', e => { if (e.target === overlay && !ended) closeSheet(); });

/* ---------- boosters ---------- */
$('#plus').addEventListener('click', () => openShop());
$('#settings').addEventListener('click', () => openSettings());
$('#profileBtn').addEventListener('click', () => openProfile());
function lockedNotice(b){ if (P().pl < +b.dataset.need){ notify(t('lockedAt',{n:b.dataset.need})); return true; } return false; }
$('#bShuffle').addEventListener('click', async () => {
  if (busy || ended || lockedNotice($('#bShuffle'))) return;
  if (!spend(COST.shuffle)) return;
  busy = true; clearHint(); setSel(null);
  await shuffleBoard();
  busy = false; scheduleHint();
});
$('#bHammer').addEventListener('click', () => {
  if (busy || ended || lockedNotice($('#bHammer'))) return;
  if (tool==='hammer'){ tool = null; hud(); return; }
  if (state.coins < COST.hammer){ openShop(t('noCoinsHammer')); return; }
  tool = 'hammer'; setSel(null); hud(); toast(t('tPick'));
});
$('#bPlaneB').addEventListener('click', () => {
  if (busy || ended || lockedNotice($('#bPlaneB'))) return;
  if (tool==='plane'){ tool = null; hud(); return; }
  if (state.coins < COST.planeB){ openShop(t('noCoins')); return; }
  tool = 'plane'; setSel(null); hud(); toast(t('tPickPlane'));
});
function useTool(cell){ const m = tool; tool = null; hud(); if (m==='hammer') useHammer(cell); else usePlaneBooster(cell); }
function usePlaneBooster(cell){
  const x = at(...cell); if (!x || x.special) return;
  if (caged(...cell)){ nope(cell); toast(t('tCaged')); return; }
  if (!spend(COST.planeB)) return;
  x.special = 'plane'; x.type = -1; x.timer = 0;
  const el = els.get(x.id); if (el){ paint(x, el); el.classList.remove('born'); void el.offsetWidth; el.classList.add('born'); }
  scheduleHint();
}
$('#bMoves').addEventListener('click', () => {
  if (busy || ended) return;
  if (spend(COST.moves)){ moves += 5; hud(); toast(t('tPlus5')); }
});
async function useHammer(cell){
  if (!spend(COST.hammer)) return;
  busy = true; clearHint(); setSel(null);
  await clearCells(new Set([key(...cell)]), [], 1);
  await gravity();
  await resolve(null, null);
  await afterMove(false);
}

/* ---------- input ---------- */
function cellAt(e){
  const r = boardEl.getBoundingClientRect();
  const c = Math.floor((e.clientX-r.left)/r.width*N), rr = Math.floor((e.clientY-r.top)/r.height*N);
  return inB([rr,c]) ? [rr,c] : null;
}
function tap(cell){
  if (selected){
    if (selected[0]===cell[0] && selected[1]===cell[1]){ setSel(null); return; }
    if (Math.abs(selected[0]-cell[0]) + Math.abs(selected[1]-cell[1]) === 1){ attemptSwap(selected, cell); return; }
  }
  const x = at(...cell);
  if (caged(...cell)){ setSel(null); nope(cell); toast(t('tCaged')); return; }
  if (x && x.special === 'plane'){ launchPlane(cell); return; }
  setSel(cell); scheduleHint();
}
async function launchPlane(cell){
  if (busy || ended || moves<=0) return;
  busy = true; clearHint(); setSel(null);
  moves--; hud();
  await resolve(new Set([key(...cell)]), null);
  await afterMove();
}
boardEl.addEventListener('pointerdown', e => {
  if (busy || ended) return;
  const cell = cellAt(e); if (!cell) return;
  if (tool){ useTool(cell); return; }
  drag = { cell, x:e.clientX, y:e.clientY, moved:false };
  try { boardEl.setPointerCapture(e.pointerId); } catch(err){}
});
boardEl.addEventListener('pointermove', e => {
  if (!drag || drag.moved) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  const th = boardEl.getBoundingClientRect().width/N*0.3;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < th) return;
  drag.moved = true;
  const d = Math.abs(dx) > Math.abs(dy) ? [0,Math.sign(dx)] : [Math.sign(dy),0];
  attemptSwap(drag.cell, [drag.cell[0]+d[0], drag.cell[1]+d[1]]);
});
boardEl.addEventListener('pointerup', () => { if (drag && !drag.moved) tap(drag.cell); drag = null; });
boardEl.addEventListener('pointercancel', () => { drag = null; });

function boot(){ applyBg(); applySkin(); applyLang(); startLevel(); }
if (cloud){
  let done = false;
  const go = () => { if (!done){ done = true; boot(); } };
  setTimeout(go, 1500);
  try {
    cloud.getItem(KEY, (err, val) => {
      if (!err && val){ try { const c = JSON.parse(val); if (c && (c.savedAt||0) > (state.savedAt||0)){ state = c; normalizeState(); } } catch(e){} }
      go();
    });
  } catch(e){ go(); }
} else boot();
})();
</script>
</body>
